name: Build KasirPro POS (Windows)

# Membangun installer 1 file: KasirPro-Setup-Windows.exe (+ KasirPro-Portable.exe)
#
# Langkah penting: aplikasi web diekspor statis lebih dulu (bundel offline)
# lalu ikut dibungkus ke dalam installer supaya kasir tetap bisa jalan tanpa
# internet. Lihat desktop/OFFLINE.md.
#
#  - push biasa / manual  -> hasil build diunggah sebagai artifact
#  - tag versi (v*)       -> sekaligus dipublikasikan ke GitHub Releases
#                            (dipakai auto-update electron-updater)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # ------------------------------------------------------------------
      # 1) Bundel offline: ekspor statis aplikasi web ke desktop/app/
      # ------------------------------------------------------------------
      - name: Install web dependencies
        run: npm ci

      - name: Build static export (bundel offline)
        env:
          DESKTOP_EXPORT: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_NAME: KasirPro POS
        run: npm run export:desktop

      - name: Verify offline bundle
        shell: pwsh
        run: |
          $index = 'desktop/app/kasir/index.html'
          if (-not (Test-Path $index)) { throw "Bundel offline tidak ditemukan: $index" }
          $size = (Get-Item $index).Length
          Write-Host "bundel offline OK ($size byte): $index"
          if (-not (Test-Path 'desktop/app/_next')) { throw "Aset _next tidak ada di bundel offline" }

      # ------------------------------------------------------------------
      # 2) Bungkus jadi installer Windows
      # ------------------------------------------------------------------
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer (Windows x64)
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true") {
            npm run dist:publish
          } else {
            npm run dist
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KasirPro-Setup-Windows
          path: |
            desktop/release/KasirPro-Setup-Windows.exe
            desktop/release/KasirPro-Portable.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          if-no-files-found: error
