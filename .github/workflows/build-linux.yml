name: Build KasirPro POS (Linux .deb)

# Build .deb via Docker agar bisa jalan di semua mesin (incl CI yang gagal).
#
# Penting: bundel offline (desktop/app) TIDAK ada di git (di-gitignore), jadi
# harus diekspor dulu di runner ini — kalau tidak, .deb akan terbangun tanpa
# antarmuka. Ekspor memakai kredensial Supabase yang sama dengan build Windows.
#
#  - push biasa / manual -> hasil build diunggah sebagai artifact
#  - tag versi (v*)      -> sekaligus dipublikasikan ke GitHub Releases
#                           (termasuk latest-linux.yml untuk auto-update .deb)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/build-linux.yml'
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # ------------------------------------------------------------------
      # 1) Bundel offline: ekspor statis aplikasi web ke desktop/app/
      # ------------------------------------------------------------------
      - name: Install web dependencies
        run: npm ci

      - name: Build static export (bundel offline)
        env:
          DESKTOP_EXPORT: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_NAME: KasirPro POS
        run: npm run export:desktop

      - name: Verify offline bundle
        run: |
          test -f desktop/app/kasir/index.html
          test -d desktop/app/_next
          echo "bundel offline OK: $(du -sh desktop/app | cut -f1)"

      # ------------------------------------------------------------------
      # 2) Bungkus jadi .deb (via Docker, butuh dpkg-dev dll.)
      # ------------------------------------------------------------------
      - name: Build .deb in Docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        run: |
          docker run --rm \
            -e GH_TOKEN \
            -e PUBLISH \
            -v "$(pwd)/desktop:/repo" \
            -w /repo \
            node:22 bash -c '
              apt-get update -qq && apt-get install -y -qq dpkg-dev libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2-plugins
              npm ci
              npx electron-builder --linux deb --x64 --publish "$PUBLISH"
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirPro-Deb
          path: |
            desktop/release/*.deb
            desktop/release/latest-linux.yml
          if-no-files-found: error
