name: Build KasirPro POS (Linux .deb)

# Build .deb untuk Linux agar bisa didownload bersama Windows .exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/build-linux.yml'
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build static export (bundel offline)
        env:
          DESKTOP_EXPORT: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_NAME: KasirPro POS
        run: npm run export:desktop

      - name: Verify offline bundle
        run: |
          test -f desktop/app/kasir/index.html || exit 1
          echo "Bundel offline OK"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer (Linux deb)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            npm run dist:publish
          else
            npm run dist
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirPro-Deb
          path: desktop/release/*.deb
          if-no-files-found: error
