name: Build KasirPro POS (Linux .deb)

# Build .deb via Docker agar bisa jalan di semua mesin (incl CI yang gagal)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/build-linux.yml'
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .deb in Docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "$(pwd)/desktop:/repo" \
            -w /repo \
            node:22 bash -c "
              apt-get update -qq && apt-get install -y -qq dpkg-dev libgtk-3-dev libnotify-dev libgconf-2-4 libnss3 libxss1 libasound2-plugins
              npm ci
              npm run dist:linux
            "

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirPro-Deb
          path: desktop/release/*.deb
          if-no-files-found: error
